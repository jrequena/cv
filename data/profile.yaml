# {years} se sustituye por los años completos desde basics.career_start
summaries:
  main:
    es: >-
      Desarrollador Full Stack Senior y Tech Lead con más de {years} años de experiencia
      en sistemas web empresariales con PHP, Angular y bases de datos relacionales.
      Diseñé y construí desde cero una plataforma universitaria de más de 10 módulos y
      más de 5.000 usuarios, que llevé a producción y sigo evolucionando. Desde 2023
      lidero un equipo de 3–5 desarrolladores, tomo decisiones de arquitectura y trabajo
      directamente con el cliente. Integro agentes de IA y MCP en el día a día del desarrollo.
  backend:
    es: >-
      Tech Lead con más de {years} años de experiencia, especializado en backend, APIs e
      integración de sistemas. Experiencia con PHP moderno y legacy (Zend, Laminas/Mezzio,
      Symfony), Node.js/Express, APIs REST y GraphQL, OAuth2 y control de acceso por roles.
      Diseñé la arquitectura de una plataforma universitaria de más de 10 módulos y más de
      5.000 usuarios, con una base de datos de más de 100.000 registros interrelacionados,
      y la hago evolucionar de forma incremental combinando módulos legacy y modernos.
  ai:
    es: >-
      Tech Lead con más de {years} años de experiencia en desarrollo backend y full stack,
      y una especialización creciente en desarrollo de software asistido por IA. En el
      trabajo uso agentes de IA y servidores MCP para consultar bases de datos, generar
      código y analizar código legacy. En proyectos personales experimento con LLMs
      locales (Ollama) y desarrollo Mabel, un generador de código PHP a partir de
      contratos YAML.

