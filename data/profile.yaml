# =============================================================================
# FUENTE ÚNICA DE DATOS DEL CV
# -----------------------------------------------------------------------------
# - Todo hecho (fechas, tecnologías, cifras) se escribe UNA sola vez aquí.
# - Los textos traducibles son mapas por idioma: { es: "...", pt-BR: "...", en: "..." }.
# - Los textos neutros (nombres de tecnologías, empresas) son strings simples.
# - `tags` decide en qué variantes del CV aparece cada logro (ver variants.yaml).
# - `priority`: 1 = imprescindible, 2 = importante, 3 = complementario.
# - No editar output/ ni README.md a mano: se generan con `python build.py`.
# =============================================================================

