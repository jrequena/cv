# {years} se sustituye por los años completos desde basics.career_start
summaries:
  main:
    es: >-
      Desarrollador Full Stack Senior y Tech Lead con más de {years} años de experiencia
      en sistemas web empresariales con PHP, Angular y bases de datos relacionales.
      Diseñé y construí desde cero una plataforma universitaria de más de 10 módulos y
      más de 5.000 usuarios, que llevé a producción y sigo evolucionando. Desde 2023
      lidero un equipo de 3–5 desarrolladores, tomo decisiones de arquitectura y trabajo
      directamente con el cliente. Integro agentes de IA y MCP en el día a día del desarrollo.
    pt-BR: >-
      Desenvolvedor Full Stack Sênior e Tech Lead com mais de {years} anos de experiência
      em sistemas web corporativos com PHP, Angular e bancos de dados relacionais.
      Projetei e construí do zero uma plataforma universitária com mais de 10 módulos e
      mais de 5.000 usuários, que levei à produção e continuo evoluindo. Desde 2023
      lidero uma equipe de 3–5 desenvolvedores, tomo decisões de arquitetura e trabalho
      diretamente com o cliente. Uso agentes de IA e MCP no dia a dia do desenvolvimento.
    en: >-
      Senior Full Stack Developer and Tech Lead with {years}+ years of experience building
      enterprise web systems with PHP, Angular and relational databases. I designed and
      built from scratch a university platform with 10+ modules and 5,000+ users, took it
      to production and keep evolving it. Since 2023 I have led a team of 3–5 developers,
      making architecture decisions and working directly with the client. I use AI agents
      and MCP in day-to-day development.
  backend:
    es: >-
      Tech Lead con más de {years} años de experiencia, especializado en backend, APIs e
      integración de sistemas. Experiencia con PHP moderno y legacy (Zend, Laminas/Mezzio,
      Symfony), Node.js/Express, APIs REST y GraphQL, OAuth2 y control de acceso por roles.
      Diseñé la arquitectura de una plataforma universitaria de más de 10 módulos y más de
      5.000 usuarios, con una base de datos de más de 100.000 registros interrelacionados,
      y la hago evolucionar de forma incremental combinando módulos legacy y modernos.
    pt-BR: >-
      Tech Lead com mais de {years} anos de experiência, especializado em backend, APIs e
      integração de sistemas. Experiência com PHP moderno e legado (Zend, Laminas/Mezzio,
      Symfony), Node.js/Express, APIs REST e GraphQL, OAuth2 e controle de acesso baseado
      em papéis. Projetei a arquitetura de uma plataforma universitária com mais de 10
      módulos e mais de 5.000 usuários, com um banco de dados de mais de 100.000 registros
      inter-relacionados, e a evoluo de forma incremental, combinando módulos legados e modernos.
    en: >-
      Tech Lead with {years}+ years of experience, specialized in backend, APIs and systems
      integration. Experience with modern and legacy PHP (Zend, Laminas/Mezzio, Symfony),
      Node.js/Express, REST and GraphQL APIs, OAuth2 and role-based access control. I
      designed the architecture of a university platform with 10+ modules and 5,000+ users,
      backed by a database of 100,000+ interrelated records, and evolve it incrementally,
      combining legacy and modern modules.
  ai:
    es: >-
      Tech Lead con más de {years} años de experiencia en desarrollo backend y full stack,
      y una especialización creciente en desarrollo de software asistido por IA. En el
      trabajo uso agentes de IA y servidores MCP para consultar bases de datos, generar
      código y analizar código legacy. En proyectos personales experimento con LLMs
      locales (Ollama) y desarrollo Mabel, un generador de código PHP a partir de
      contratos YAML.
    pt-BR: >-
      Tech Lead com mais de {years} anos de experiência em desenvolvimento backend e full
      stack, e uma especialização crescente em desenvolvimento de software assistido por IA.
      No trabalho uso agentes de IA e servidores MCP para consultar bancos de dados, gerar
      código e analisar código legado. Em projetos pessoais experimento com LLMs locais
      (Ollama) e desenvolvo o Mabel, um gerador de código PHP a partir de contratos YAML.
    en: >-
      Tech Lead with {years}+ years of experience in backend and full stack development,
      and a growing focus on AI-assisted software development. At work I use AI agents and
      MCP servers to query databases, generate code and analyze legacy code. In personal
      projects I experiment with local LLMs (Ollama) and build Mabel, a PHP code generator
      driven by YAML contracts.

